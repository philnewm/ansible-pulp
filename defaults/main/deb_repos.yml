---

pulp_deb_remotes:
  - name: debian
    url: http://deb.debian.org/debian
    architectures: amd64
    distributions: "trixie"
    components: "main contrib non-free non-free-firmware"
    policy: "immediate"
    sync_sources: false
    sync_installer: true
    sync_udebs: true
  - name: debian-security
    url: http://security.debian.org/debian-security
    architectures: amd64
    distributions: "trixie-security"
    components: "main contrib non-free non-free-firmware"
    policy: "on_demand"
    sync_sources: false
    sync_installer: false
    sync_udebs: false
  - name: debian-updates
    url: http://deb.debian.org/debian
    architectures: amd64
    distributions: "trixie-updates"
    components: "main contrib non-free non-free-firmware"
    policy: "on_demand"
    sync_sources: false
    sync_installer: false
    sync_udebs: false

pulp_deb_repositories:
  - name: "debian"
    description: Local debian mirror
    remote: "debian"
    pulp_labels:
      default_base_path: "debian"
      default_publication_mode: "verbatim"
  - name: "debian-security"
    description: Local debian-security mirror
    remote: "debian-security"
    pulp_labels:
      default_base_path: "debian-security"
      default_publication_mode: "structured"
  - name: "debian-updates"
    description: Local debian-updates mirror
    remote: "debian-updates"
    pulp_labels:
      default_base_path: "debian"
      default_publication_mode: "structured"

...
