---

- name: Ensure required venv system packages are installed
  become: true
  ansible.builtin.package:
    name: "{{ pulp_venv_system_packages[ansible_facts.os_family | lower] }}"
    state: present
    update_cache: true

- name: Install pulp.squeezer dependencies into venv
  become: true
  ansible.builtin.pip:
    name: "{{ pulp_venv_python_packages }}"
    virtualenv: "{{ pulp_ansible_venv }}"
    virtualenv_command: "python3 -m venv"

- name: Ensure pulp-cli config directory exists
  become: true
  ansible.builtin.file:
    path: "{{ pulp_cli_config_path | dirname }}"
    state: directory
    owner: "{{ pulp_user }}"
    group: "{{ pulp_user }}"
    mode: "0700"

- name: Configure pulp-cli authentication
  become: true
  become_user: "{{ pulp_user }}"
  ansible.builtin.blockinfile:
    path: "{{ pulp_user_home }}/.config/pulp/cli.toml"
    create: true
    mode: "0600"
    block: |
      [cli]
      base_url = "{{ pulp_url }}"
      username = "{{ pulp_admin_username }}"
      password = "{{ pulp_admin_password }}"

- name: Query pulp api status
  environment:
    PYTHONPATH: "{{ pulp_ansible_venv }}/lib/python{{ ansible_facts.python.version.major }}.{{ ansible_facts.python.version.minor }}/site-packages"
  pulp.squeezer.status:
    pulp_url: "{{ pulp_url }}"
    username: "{{ pulp_admin_username }}"
    password: "{{ pulp_admin_password }}"
    validate_certs: "{{ pulp_validate_certs }}"
  register: pulp_api_status
  failed_when: false

- name: Verify pulp api access
  ansible.builtin.assert:
    that:
      - pulp_api_status.status.content_settings.content_path_prefix == pulp_content_path_prefix
    fail_msg: "Failed accessing pulp's api at '{{ pulp_url }}'"
    quiet: true

...
