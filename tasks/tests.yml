---

- name: Get pulp status
  ansible.builtin.uri:
    url: "{{ pulp_url }}/pulp/api/v3/status/"
  failed_when: false
  register: pulp_status_endpoint

- name: Test pulp api status
  ansible.builtin.assert:
    that:
      - pulp_status_endpoint.status == 200
    fail_msg: "No response from pulp api, recieved code {{ pulp_status_endpoint.status }}"
    quiet: true

- name: Query pulp api status
  environment:
    PYTHONPATH: "{{ pulp_ansible_venv }}/lib/python{{ ansible_facts.python.version.major }}.{{ ansible_facts.python.version.minor }}/site-packages"
  pulp.squeezer.status:
    pulp_url: "{{ pulp_url }}"
    username: "{{ pulp_admin_username }}"
    password: "{{ pulp_admin_password }}"
    validate_certs: "{{ pulp_validate_certs }}"
  register: pulp_api_status
  failed_when: false

- name: Verify pulp api access
  ansible.builtin.assert:
    that:
      - pulp_api_status.status.content_settings.content_path_prefix == pulp_content_path_prefix
    fail_msg: "Failed accessing pulp's api at '{{ pulp_url }}'"
    quiet: true

...
