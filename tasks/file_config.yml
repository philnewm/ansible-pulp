---

- name: Create file repositories
  vars:
    ansible_python_interpreter: "{{ pulp_ansible_venv }}/bin/python"
  loop: "{{ pulp_file_repositories }}"
  loop_control:
    loop_var: file_repository
    label: "{{ file_repository.name }}"
  pulp.squeezer.file_repository:
    pulp_url: "{{ pulp_url }}"
    username: "{{ pulp_admin_username }}"
    password: "{{ pulp_admin_password }}"
    name: "{{ file_repository.name }}"
    description: "{{ file_repository.description }}"
    state: present
  register: file_repo

# TODO remove when pulp_labels parameter is supported in file_repository
- name: Set labels for file repositories
  environment:
    PYTHONPATH: "{{ pulp_ansible_venv }}/lib/python{{ ansible_facts.python.version.major }}.{{ ansible_facts.python.version.minor }}/site-packages"
  loop: "{{ file_repo.results }}"
  loop_control:
    loop_var: "file_repo_data"
    label: "{{ file_repo_data.repository.name }}"
  when: file_repo_data.file_repository.pulp_labels is defined and file_repo_data.changed
  pulp.squeezer.api_call:
    pulp_url: "{{ pulp_url }}"
    username: "{{ pulp_admin_username }}"
    password: "{{ pulp_admin_password }}"
    operation_id: repositories_file_file_partial_update
    parameters:
      file_file_repository_href: "{{ file_repo_data.repository.pulp_href }}"
    body:
      pulp_labels: "{{ file_repo_data.file_repository.pulp_labels }}"

- name: Upload content units
  vars:
    ansible_python_interpreter: "{{ pulp_ansible_venv }}/bin/python"
  become: true
  become_user: "{{ pulp_user }}"
  loop: "{{ pulp_file_content }}"
  loop_control:
    loop_var: file_content
    label: "{{ file_content.name }}"
  pulp.squeezer.file_content:
    pulp_url: "{{ pulp_url }}"
    username: "{{ pulp_admin_username }}"
    password: "{{ pulp_admin_password }}"
    file: "{{ file_content.file_path }}"
    relative_path: "{{ file_content.relative_path }}"
    repository: "{{ file_content.repository }}"
    state: present

- name: Create file publications
  vars:
    ansible_python_interpreter: "{{ pulp_ansible_venv }}/bin/python"
  become: true
  become_user: "{{ pulp_user }}"
  loop: "{{ pulp_file_repositories }}"
  loop_control:
    loop_var: file_repository
    label: "{{ file_repository.name }}"
  pulp.squeezer.file_publication:
    pulp_url: "{{ pulp_url }}"
    username: "{{ pulp_admin_username }}"
    password: "{{ pulp_admin_password }}"
    repository: "{{ file_repository.name }}"
    state: present
  register: file_publication

- name: Distribute file distributions
  vars:
    ansible_python_interpreter: "{{ pulp_ansible_venv }}/bin/python"
  become: true
  become_user: "{{ pulp_user }}"
  loop: "{{ file_publication.results }}"
  loop_control:
    loop_var: publication
    label: "{{ publication.file_repository.name }}"
  pulp.squeezer.file_distribution:
    pulp_url: "{{ pulp_url }}"
    username: "{{ pulp_admin_username }}"
    password: "{{ pulp_admin_password }}"
    name: "{{ publication.file_repository.name }}-pub"
    base_path: "{{ publication.file_repository.name }}"
    publication: "{{ publication.publication.pulp_href }}"
    state: present

...
