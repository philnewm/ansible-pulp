---

- name: Install pip module dependencies
  become: true
  ansible.builtin.package:
    name: python3-packaging
    state: present

- name: Install pulp.squeezer dependencies into venv
  become: true
  ansible.builtin.pip:
    name: "{{ pulp_venv_python_packages }}"
    virtualenv: "{{ pulp_ansible_venv }}"
    virtualenv_command: "python3 -m venv"

- name: Check for selinux mode
  when: ansible_facts.os_family | lower == "redhat"
  ansible.builtin.command:
    cmd: getenforce
  register: se_linux_status
  changed_when: false

- name: Read /etc/subuid
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      cat /etc/subuid | grep {{ pulp_user }}
    executable: /bin/bash
  register: subuids
  changed_when: false

- name: Read /etc/subgid
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      cat /etc/subgid | grep {{ pulp_user }}
    executable: /bin/bash
  register: subgids
  changed_when: false

- name: Ensure directories for volumes exist
  become: true
  loop: "{{ pulp_volumes }}"
  loop_control:
    label: "{{ item.name }}"
  ansible.builtin.file:
    path: "{{ item.host_path }}"
    state: directory
    owner: "{{ item.owner | default(pulp_user) }}"
    group: "{{ item.group | default(pulp_user) }}"
    mode: "{{ item.permissions }}"

- name: Ensure certs directories exist
  become: true
  ansible.builtin.file:
    path: "{{ pulp_service_dir }}/settings/certs"
    state: directory
    owner: "{{ pulp_user }}"
    group: "{{ pulp_user }}"
    mode: '0755'

- name: Ensure pulp content_origin is set
  become: true
  become_user: "{{ pulp_user }}"
  loop:
    - "CONTENT_ORIGIN='http://{{ ansible_facts.hostname }}:8080'"
    - "CONTENT_PATH_PREFIX='{{ pulp_content_path_prefix }}'"
  ansible.builtin.lineinfile:
    path: "{{ pulp_service_dir }}/settings/settings.py"
    line: "{{ item }}"
    create: true
    state: present
    mode: '0644'

- name: Ensure .config/systemd/user directory exists
  become: true
  ansible.builtin.file:
    path: "{{ pulp_user_home }}/.config/containers/systemd"
    state: directory
    owner: "{{ pulp_user }}"
    group: "{{ pulp_user }}"
    mode: "0700"

# TODO more elegant solution
- name: Prepare volume mounts with SELinux relabel if needed
  ansible.builtin.set_fact:
    pulp_volumes_mounts: >-
      {{
        pulp_volumes
        | map('community.general.json_query',
              "join(':', [host_path, container_path])")
        | map('regex_replace', '$',
              ':Z' if (se_linux_status.stdout | default('disabled') | lower) == 'enforcing' else '')
        | list
      }}

- name: Template pulp quadlet
  become: true
  ansible.builtin.template:
    src: pulp.container.j2
    dest: "{{ pulp_user_home }}/.config/containers/systemd/pulp.container"
    owner: "{{ pulp_user }}"
    group: "{{ pulp_user }}"
    mode: "0640"
  register: quadlet_result

# Note /var/run/user/<uid>/systemd/generator/pulp.service
- name: Enable and start generated systemd service
  become: true
  become_user: "{{ pulp_user }}"
  ansible.builtin.systemd:
    name: "{{ pulp_container_name }}.service"
    scope: user
    enabled: true
    state: started
    daemon_reload: true

...
